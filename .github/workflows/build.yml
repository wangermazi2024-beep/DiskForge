name: 编译 Windows 可执行文件

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: 编译 Windows exe
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 编译
        run: cargo build --release

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: DiskForge-windows
          path: target/release/DiskForge.exe
