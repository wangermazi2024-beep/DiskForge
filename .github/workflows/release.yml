name: Release

# 一键编译发布到 GitHub Releases，两种触发方式任选其一：
#  1. 手动：GitHub 仓库页 → Actions → Release → Run workflow（一键发布）
#  2. 自动：推送一个 v 开头的标签（git tag v0.1 && git push origin v0.1）
#
# 发布内容：Release 构建（含图标/版本资源的单文件 DiskForge.exe）打包成
# zip，附 SHA256 校验值，发布到仓库的 Releases 页面。重复发布同一个标签
# 时只覆盖附件（--clobber），不会重复建 Release。
#
# Release Notes：自动生成（--generate-notes），基于上一个 tag 到当前 tag
# 之间合并的 PR 标题/commit 自动整理成"What's Changed"列表，前面附一段
# 固定的使用说明。无需手动维护 CHANGELOG.md。
# 想要更完整的效果，建议改动尽量走 Pull Request 合并，并把 PR 标题写清楚，
# 因为 GitHub 是按 PR 标题分组生成日志的；直接 push 到主分支的 commit
# 也会被抓取，但排版不如 PR 标题整齐。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，--generate-notes 需要用它对比上一个 tag

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Windows 原生工具链（MSVC）构建；build.rs 会用 rc.exe 把图标和
      # 版本/版权资源写进 exe，资源管理器里看到的文件图标与属性页信息
      # 都在这一步生成。
      - name: Build release exe
        run: cargo build --release

      - name: Determine release tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
            TAG="v$CARGO_VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # windows-latest runner 上没有原生 zip 命令，改用 PowerShell 自带的
      # Compress-Archive，无需安装任何第三方工具。
      - name: Package
        shell: pwsh
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $STAGE = "DiskForge-$env:TAG-windows-x64"
          New-Item -ItemType Directory -Path $STAGE | Out-Null
          Copy-Item target/release/DiskForge.exe $STAGE/
          Copy-Item README.md, LICENSE $STAGE/
          Compress-Archive -Path $STAGE -DestinationPath "$STAGE.zip"
          $hash = (Get-FileHash "$STAGE.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $STAGE.zip" | Out-File -FilePath "$STAGE.zip.sha256" -Encoding ascii -NoNewline

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          ZIP: DiskForge-${{ steps.ver.outputs.tag }}-windows-x64.zip
        run: |
          cat > release_notes_header.md <<'EOF'
          免费、单文件、免安装的 Windows 磁盘空间分析器。

          - 下载下方 zip，解压后双击 `DiskForge.exe` 即可运行（无需安装）
          - 想要极速扫描请右键选择"以管理员身份运行"
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --target "$GITHUB_SHA" \
              --title "DiskForge $TAG" \
              --notes-file release_notes_header.md \
              --generate-notes
          fi
